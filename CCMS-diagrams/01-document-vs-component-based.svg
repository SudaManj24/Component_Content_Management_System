<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 290" role="img" aria-labelledby="f1t f1d" xmlns="http://www.w3.org/2000/svg" width="720" height="290">
    <title id="f1t">Document-based versus component-based content</title>
    <desc id="f1d">On the left, three documents each contain their own copy of the same warning. On the right, a repository stores each component once and three documents reference the components.</desc>
    <defs>
      <marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgb(86, 101, 115)" stroke="none" stroke-width="1px" stroke-dasharray="none"></path></marker>
    </defs>
    <text x="20" y="22" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13.5px" font-weight="600">Document-based</text>
    <text x="390" y="22" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13.5px" font-weight="600">Component-based</text>
    <line x1="365" y1="10" x2="365" y2="272" fill="rgb(0, 0, 0)" stroke="rgb(213, 221, 229)" stroke-width="1.5px" stroke-dasharray="3px, 5px"></line>

