    <rect x="28" y="64" width="84" height="40" rx="6" fill="rgb(220, 232, 251)" stroke="rgb(43, 108, 223)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="70" y="89" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Intro</text>
    <rect x="28" y="112" width="84" height="40" rx="6" fill="rgb(231, 224, 251)" stroke="rgb(109, 74, 216)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="70" y="137" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Warning</text>
    <rect x="28" y="160" width="84" height="40" rx="6" fill="rgb(211, 240, 234)" stroke="rgb(14, 143, 126)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="70" y="185" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Steps</text>
    <!-- Doc B -->
    <rect x="130" y="36" width="100" height="180" rx="8" fill="rgb(255, 255, 255)" stroke="rgb(213, 221, 229)" stroke-width="1.5px" stroke-dasharray="none"></rect>
    <text x="140" y="55" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">Doc B</text>
    <rect x="138" y="64" width="84" height="40" rx="6" fill="rgb(220, 232, 251)" stroke="rgb(43, 108, 223)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="180" y="89" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Intro</text>
    <rect x="138" y="112" width="84" height="40" rx="6" fill="rgb(231, 224, 251)" stroke="rgb(109, 74, 216)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="180" y="137" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Warning</text>
    <rect x="138" y="160" width="84" height="40" rx="6" fill="rgb(251, 235, 194)" stroke="rgb(183, 121, 31)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="180" y="185" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Specs</text>
