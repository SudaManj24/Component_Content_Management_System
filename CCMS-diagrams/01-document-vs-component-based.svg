    <rect x="248" y="64" width="84" height="40" rx="6" fill="rgb(211, 240, 234)" stroke="rgb(14, 143, 126)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="290" y="89" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Steps</text>
    <rect x="248" y="112" width="84" height="40" rx="6" fill="rgb(231, 224, 251)" stroke="rgb(109, 74, 216)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="290" y="137" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Warning</text>
    <rect x="248" y="160" width="84" height="40" rx="6" fill="rgb(251, 235, 194)" stroke="rgb(183, 121, 31)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="290" y="185" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Specs</text>
    <text x="20" y="242" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">The same warning is copied into</text>
    <text x="20" y="260" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">every document that needs it.</text>

    <!-- Repository -->
    <rect x="390" y="36" width="320" height="96" rx="10" fill="rgb(255, 255, 255)" stroke="rgb(213, 221, 229)" stroke-width="1.5px" stroke-dasharray="none"></rect>
    <text x="402" y="56" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">Component repository</text>
    <rect x="402" y="68" width="68" height="48" rx="6" fill="rgb(220, 232, 251)" stroke="rgb(43, 108, 223)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="436" y="96" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Concept</text>
    <rect x="480" y="68" width="68" height="48" rx="6" fill="rgb(211, 240, 234)" stroke="rgb(14, 143, 126)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="514" y="96" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Task</text>
    <rect x="558" y="68" width="68" height="48" rx="6" fill="rgb(251, 235, 194)" stroke="rgb(183, 121, 31)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="592" y="96" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Reference</text>
    <rect x="636" y="68" width="68" height="48" rx="6" fill="rgb(231, 224, 251)" stroke="rgb(109, 74, 216)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="670" y="96" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Warning</text>
    <path d="M550 132L440 176" marker-end="url(#ah1)" fill="none" stroke="rgb(86, 101, 115)" stroke-width="1.5px" stroke-dasharray="none"></path>
    <path d="M550 132L555 176" marker-end="url(#ah1)" fill="none" stroke="rgb(86, 101, 115)" stroke-width="1.5px" stroke-dasharray="none"></path>
    <path d="M550 132L670 176" marker-end="url(#ah1)" fill="none" stroke="rgb(86, 101, 115)" stroke-width="1.5px" stroke-dasharray="none"></path>
    <rect x="395" y="180" width="90" height="40" rx="8" fill="rgb(255, 255, 255)" stroke="rgb(213, 221, 229)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="440" y="205" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Doc A</text>
    <rect x="510" y="180" width="90" height="40" rx="8" fill="rgb(255, 255, 255)" stroke="rgb(213, 221, 229)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="555" y="205" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Doc B</text>
    <rect x="625" y="180" width="90" height="40" rx="8" fill="rgb(255, 255, 255)" stroke="rgb(213, 221, 229)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="670" y="205" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">Doc C</text>
    <text x="390" y="242" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">Each component is stored once and</text>
    <text x="390" y="260" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">assembled into documents by reference.</text>
