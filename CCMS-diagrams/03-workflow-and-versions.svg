<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 -16 720 232" role="img" aria-labelledby="f3t f3d" xmlns="http://www.w3.org/2000/svg" width="720" height="232">
    <title id="f3t">Example component workflow with roles and versions</title>
    <desc id="f3d">A component moves from Draft to In review to Approved to Published. Reviewers can send it back to Draft. Below, a version history shows v1.0, v1.1 and v2.0.</desc>
    <defs>
      <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgb(86, 101, 115)" stroke="none" stroke-width="1px" stroke-dasharray="none"></path></marker>
    </defs>
    <rect x="20" y="30" width="140" height="46" rx="23" fill="rgb(255, 255, 255)" stroke="rgb(22, 33, 43)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="90" y="58" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13.5px" font-weight="600">Draft</text>
    <rect x="200" y="30" width="140" height="46" rx="23" fill="rgb(255, 255, 255)" stroke="rgb(22, 33, 43)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="270" y="58" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13.5px" font-weight="600">In review</text>
    <rect x="380" y="30" width="140" height="46" rx="23" fill="rgb(255, 255, 255)" stroke="rgb(22, 33, 43)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="450" y="58" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13.5px" font-weight="600">Approved</text>
    <rect x="560" y="30" width="140" height="46" rx="23" fill="rgb(255, 255, 255)" stroke="rgb(22, 33, 43)" stroke-width="1.5px" stroke-dasharray="none"></rect><text x="630" y="58" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13.5px" font-weight="600">Published</text>
    <path d="M160 53L196 53" marker-end="url(#ah3)" fill="none" stroke="rgb(86, 101, 115)" stroke-width="1.5px" stroke-dasharray="none"></path>
    <path d="M340 53L376 53" marker-end="url(#ah3)" fill="none" stroke="rgb(86, 101, 115)" stroke-width="1.5px" stroke-dasharray="none"></path>
    <path d="M520 53L556 53" marker-end="url(#ah3)" fill="none" stroke="rgb(86, 101, 115)" stroke-width="1.5px" stroke-dasharray="none"></path>
    <path d="M270 30C270 -6 90 -6 90 30" marker-end="url(#ah3)" fill="none" stroke="rgb(86, 101, 115)" stroke-width="1.5px" stroke-dasharray="none"></path>
    <text x="180" y="-3" text-anchor="middle" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">changes requested</text>

    <text x="90" y="102" text-anchor="middle" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">Author writes</text><text x="90" y="119" text-anchor="middle" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">and edits</text>
    <text x="270" y="102" text-anchor="middle" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">Reviewers</text><text x="270" y="119" text-anchor="middle" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">comment</text>
    <text x="450" y="102" text-anchor="middle" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">Approver</text><text x="450" y="119" text-anchor="middle" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">signs off</text>
    <text x="630" y="102" text-anchor="middle" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">Content is</text><text x="630" y="119" text-anchor="middle" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">released</text>

    <line x1="20" y1="140" x2="700" y2="140" fill="rgb(0, 0, 0)" stroke="rgb(213, 221, 229)" stroke-width="1.5px" stroke-dasharray="3px, 5px"></line>
    <text x="20" y="162" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">Version history of one component</text>
    <line x1="55" y1="187" x2="275" y2="187" fill="none" stroke="rgb(22, 33, 43)" stroke-width="1.5px" stroke-dasharray="none"></line>
    <rect x="20" y="172" width="70" height="30" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(22, 33, 43)" stroke-width="2px" stroke-dasharray="none"></rect><text x="55" y="192" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">v1.0</text>
    <rect x="130" y="172" width="70" height="30" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(22, 33, 43)" stroke-width="2px" stroke-dasharray="none"></rect><text x="165" y="192" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">v1.1</text>
    <rect x="240" y="172" width="70" height="30" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(22, 33, 43)" stroke-width="2px" stroke-dasharray="none"></rect><text x="275" y="192" text-anchor="middle" fill="rgb(22, 33, 43)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="600">v2.0</text>
    <text x="340" y="192" fill="rgb(86, 101, 115)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5px" font-weight="400">Each saved revision is recorded, so changes can be traced.</text>
  </svg>