    <rect x="270" y="115" width="180" height="70" rx="12" fill="rgb(22, 33, 43)" stroke="none" stroke-width="1px" stroke-dasharray="none"></rect>
    <text x="360" y="146" text-anchor="middle" fill="rgb(246, 248, 250)" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="16px" font-weight="600">CCMS</text>
